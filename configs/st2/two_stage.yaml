# Subtask 2 two-stage system (run ST2-two-stage).
# Each candidate is de-rendered by CapRL in its own sequence, without the
# claim; the Thinking reasoner compares both captions, both images and the
# claim. No operation hint. Test runs add --png_only.
# Source: subtask2/qwen3vl2model.py
name: st2_two_stage
subtask: claim_evidence
prompts: st2/two_stage
model: Qwen/Qwen3-VL-30B-A3B-Thinking
generation:
  max_new_tokens: 16384
  repetition_penalty: 1.15
  chat_template_kwargs: {enable_thinking: true}
batch_size: 2
image_max_side: 1920
table_json: true
context_values: ["yes", "full paper", "true", "1"]
operation_hint: false
scoped_figure_context: true
vote_tiebreak: earliest
adjudication: {enabled: true, contrastive: true, trace_chars: 1100}   # only fires when N>1
captioner:
  model: internlm/CapRL-Qwen3VL-4B
  max_new_tokens: 8192
  chat_template_kwargs: {}    # Stage 1 runs without the thinking flag
  evidence_types: [figure, table]
submission_unparsed: evidence_id_1
